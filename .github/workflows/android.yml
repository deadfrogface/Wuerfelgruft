name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [store, dev]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Abhaengigkeiten installieren
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @fontsource/grenze-gotisch @fontsource/alegreya-sans

      - name: Web-Dateien und Schriften vorbereiten
        run: |
          mkdir -p www/fonts
          cp index.html www/index.html
          if [ "${{ matrix.variant }}" = "dev" ]; then
            # DEV-Version: Entwickler-Werkzeuge an, eigene App-ID (parallel zur Store-Version installierbar), eigener Name
            sed -i 's/const DEVBUILD=false;/const DEVBUILD=true;/' www/index.html
            grep -c "DEVBUILD=true" www/index.html
            sed -i 's/"appId": "com.wuerfelgruft.game"/"appId": "com.wuerfelgruft.dev"/; s/"appName": "Würfelgruft"/"appName": "Würfelgruft DEV"/' capacitor.config.json
            cat capacitor.config.json | head -4
          fi
          cp node_modules/@fontsource/grenze-gotisch/files/grenze-gotisch-latin-{600,800}-normal.woff2 www/fonts/
          cp node_modules/@fontsource/alegreya-sans/files/alegreya-sans-latin-{400,500,700,800}-normal.woff2 www/fonts/
          ls www/fonts

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx cap sync android

      - name: Icon, Splash und Manifest anpassen
        run: |
          pip install pillow
          python3 brand.py android/app/src/main/res
          sed -i 's/android:launchMode="singleTask"/android:launchMode="singleTask" android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          # AdMob-App-ID (Variable ADMOB_APP_ID im Repo, sonst Googles Test-ID)
          ADMOB_ID="${{ vars.ADMOB_APP_ID }}"; [ -z "$ADMOB_ID" ] && ADMOB_ID="ca-app-pub-3940256099942544~3347511713"
          sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_ID\"/></application>#" android/app/src/main/AndroidManifest.xml
          grep -n "APPLICATION_ID" android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          grep -n "screenOrientation" android/app/src/main/AndroidManifest.xml

      - name: Ziel-API anzeigen
        run: grep -n "SdkVersion" android/variables.gradle || true

      - name: Release-APK bauen
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Schluessel bereitstellen
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KS=$RUNNER_TEMP/release.p12
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "$KS_B64" | base64 -d > $KS
            echo "Eigener Schluessel aus den Secrets"
            echo "KS_PASS_USE=$KS_PASS" >> $GITHUB_ENV
            echo "KS_ALIAS_USE=$KS_ALIAS" >> $GITHUB_ENV
          else
            base64 -d keystore.b64 > $KS 2>/dev/null || true
            if ! keytool -list -keystore $KS -storetype PKCS12 -storepass wuerfelgruft >/dev/null 2>&1; then
              echo "Schluessel unlesbar, erzeuge neuen Hobby-Schluessel"
              rm -f $KS
              keytool -genkeypair -keystore $KS -storetype PKCS12 -alias wuerfelgruft -keyalg RSA -keysize 2048 -validity 36500 -storepass wuerfelgruft -keypass wuerfelgruft -dname "CN=Wuerfelgruft, O=Wuerfelgruft, C=DE"
            fi
            echo "KS_PASS_USE=wuerfelgruft" >> $GITHUB_ENV
            echo "KS_ALIAS_USE=wuerfelgruft" >> $GITHUB_ENV
          fi

      - name: APK ausrichten und signieren
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          KS=$RUNNER_TEMP/release.p12
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$IN" $RUNNER_TEMP/aligned.apk
          $BT/apksigner sign --ks $KS --ks-type PKCS12 --ks-pass pass:$KS_PASS_USE --key-pass pass:$KS_PASS_USE --out Wuerfelgruft.apk $RUNNER_TEMP/aligned.apk
          $BT/apksigner verify --verbose Wuerfelgruft.apk | head -5
          ls -la Wuerfelgruft.apk

      - name: Play-Store-Bundle (AAB) bauen
        if: matrix.variant == 'store'
        continue-on-error: true
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon
          KS=$RUNNER_TEMP/release.p12
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          jarsigner -keystore $KS -storetype PKCS12 -storepass "$KS_PASS_USE" -keypass "$KS_PASS_USE" -signedjar ../Wuerfelgruft.aab "$AAB" "$KS_ALIAS_USE"
          ls -la ../Wuerfelgruft.aab

      - name: DEV-APK umbenennen
        if: matrix.variant == 'dev'
        run: mv Wuerfelgruft.apk Wuerfelgruft-DEV.apk

      - uses: actions/upload-artifact@v4
        if: matrix.variant == 'store'
        with:
          name: Wuerfelgruft-APK
          path: Wuerfelgruft.apk

      - uses: actions/upload-artifact@v4
        if: matrix.variant == 'dev'
        with:
          name: Wuerfelgruft-DEV-APK
          path: Wuerfelgruft-DEV.apk

      - uses: actions/upload-artifact@v4
        if: matrix.variant == 'store' && hashFiles('Wuerfelgruft.aab') != ''
        with:
          name: Wuerfelgruft-AAB
          path: Wuerfelgruft.aab

      - name: Release veroeffentlichen
        if: github.ref == 'refs/heads/main' && matrix.variant == 'store'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Würfelgruft 1.${{ github.run_number }}
          files: |
            Wuerfelgruft.apk
            Wuerfelgruft.aab
          body: "APK herunterladen und öffnen. Android fragt einmalig nach der Erlaubnis für Installationen aus dieser Quelle."

      - name: DEV-Release veroeffentlichen
        if: github.ref == 'refs/heads/main' && matrix.variant == 'dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Würfelgruft DEV (neuester Stand)
          prerelease: true
          make_latest: false
          files: Wuerfelgruft-DEV.apk
          body: "Entwickler-Version mit DEV-Menü (Gruftsteine, Events, Etage wählen, Unverwundbar). Eigene App, läuft neben der normalen Version, eigener Spielstand."
